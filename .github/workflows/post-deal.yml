name: Post Instagram Deal

on:
  schedule:
    - cron: '0 7 * * *'   # 10:00 Europe/Istanbul
    - cron: '0 12 * * *'  # 15:00 Europe/Istanbul
    - cron: '0 17 * * *'  # 20:00 Europe/Istanbul
  workflow_dispatch: {}

jobs:
  post-deal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instagram-automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Firecrawl CLI
        run: npm install -g firecrawl-cli

      - name: Run automation
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node run.js
